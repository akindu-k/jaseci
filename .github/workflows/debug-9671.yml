name: debug-9671

on:
  push:
    branches: [debug/9671-metrics-k8s]

jobs:
  probe:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scenario: control-1-worker, workers: 1 }
          - { scenario: baseline-2-workers, workers: 2 }
          - { scenario: recycle-workers, workers: 2, max_requests: 20, pings: 30 }
          - { scenario: extra-prometheus-client-dep, workers: 2, extra_dep: 'prometheus-client = "==0.20.0"' }
          - { scenario: 2-replicas-external-postgres, workers: 2, replicas: 2, external_db: 1 }
          - { scenario: soak-45m, workers: 2, duration: 45 }
    env:
      SCENARIO: ${{ matrix.scenario }}
      WORKERS: ${{ matrix.workers }}
      REPLICAS: ${{ matrix.replicas || 1 }}
      MAX_REQUESTS: ${{ matrix.max_requests || 0 }}
      EXTRA_DEP: ${{ matrix.extra_dep || '' }}
      EXTERNAL_DB: ${{ matrix.external_db || 0 }}
      DURATION_MIN: ${{ matrix.duration || 6 }}
      PINGS_PER_CYCLE: ${{ matrix.pings || 10 }}
    steps:
      - uses: actions/checkout@v5

      - name: Install the released jac
        run: |
          bash scripts/install.sh --version 0.37.23
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          jac --version

      - name: Install scale deploy deps
        run: |
          jac install \
            "python-dotenv>=1.2.1,<2.0.0" \
            "kubernetes>=34.1.0,<35.0.0" "docker>=7.1.0,<8.0.0" "humanize>=4.0.0" \
            --global

      - name: Set up kind cluster
        run: |
          curl -fsSL -o ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          curl -fsSL -o kubectl https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl
          sudo install kubectl /usr/local/bin/kubectl
          kind create cluster --name jac --wait 150s

      - name: Probe
        run: bash scripts/debug_9671_probe.sh
